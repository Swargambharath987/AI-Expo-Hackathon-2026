# Free checks on every push and pull request: no API key, no model calls.
# The paid agent eval (python -m evals.run --only agent) is run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # same as the Dockerfile
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install (CPU-only torch keeps the download small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Retrieval eval (real embeddings + vectorstore, no LLM)
        # Gate a little under the current 0.670 so small label edits don't fail CI
        run: python -m evals.run --only retrieval --min-mrr 0.64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-report
          path: evals/reports/*.md

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # same as the Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
