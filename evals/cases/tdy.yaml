        tools_required: [calculate_travel_cost]
        args:
          calculate_travel_cost:
            destination_city: {any_of: ["wainwright", "fairbanks"]}
            destination_state: {eq: AK}
            travel_days: {num: 7}
            travel_mode: {eq: POV}
            one_way_miles: {num: 360}
        tdy_total: {destination_city: Fairbanks, destination_state: AK, travel_days: 7, travel_mode: POV, one_way_miles: 360}
        form: any

- id: tdy_estimate_only_no_form
  category: tdy_cost
  tags: [tdy]
  tab: travel
  description: User explicitly does not want paperwork — no DD 1610 should be generated.
  turns:
    - message: "Just a rough estimate, I'm not submitting anything yet: a 2-day TDY from Fort Meade to Fort Belvoir, VA by POV."
      expect:
        tools_required: [calculate_travel_cost]
        tools_forbidden: [fill_form]
        args:
          calculate_travel_cost:
            destination_city: {any_of: ["belvoir"]}
            destination_state: {eq: VA}
            travel_days: {num: 2}
            travel_mode: {eq: POV}
            one_way_miles: {num: 35}
        tdy_total: {destination_city: Fort Belvoir, destination_state: VA, travel_days: 2, travel_mode: POV, one_way_miles: 35}
        form: none

- id: tdy_cost_then_dd1610
  category: tdy_form
  tags: [tdy, form]
  tab: travel
  description: Two turns — cost first, then the DD 1610 with details given in turn 2.
  turns:
    - message: "I'm going TDY from Fort Liberty to Fort Jackson, SC for 4 days, driving my POV. What's the cost?"
      expect:
        tools_required: [calculate_travel_cost]
        args:
          calculate_travel_cost:
            destination_city: {any_of: ["jackson", "columbia"]}
            destination_state: {eq: SC}
            travel_days: {num: 4}
            travel_mode: {eq: POV}
            one_way_miles: {num: 420}
        tdy_total: {destination_city: Fort Jackson, destination_state: SC, travel_days: 4, travel_mode: POV, one_way_miles: 420}
        form: any
    - message: "Great, fill out the DD 1610 for that trip. I depart 3 Aug 2026, purpose is Drill Sergeant School in-processing."
      expect:
        tools_required: [fill_form]
        args:
          fill_form:
            form_name: {eq: DD_1610}
        form: DD_1610
        form_fields:
          name_last_first: {contains: "Carter"}
          destination: {any_of: ["jackson", "columbia"]}
          travel_days: {num: 4}
          departure_date: {regex: "(3|03)\\s*AUG|AUG\\w*\\s*0?3\\b|2026-08-03|08/03"}
          purpose: {regex: "drill sergeant"}
          cost_estimate: {regex: "1,?156"}
