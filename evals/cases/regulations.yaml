- id: reg_receipt_threshold
  category: regulation
  tab: travel
  description: A $40 taxi is under the $75 itemized-receipt threshold (lodging always needs one).
  turns:
    - message: "Do I need a receipt for a $40 taxi ride on TDY?"
      expect:
        tools_required: [search_regulations]
        tools_forbidden: [fill_form, calculate_travel_cost]
        args:
          search_regulations:
            domain: {eq: travel, optional: true}
        form: none
        answer_regex: ["^\\W*no", "\\$?75"]

