# Pure regulation questions: must call search_regulations, must NOT fill a
# form, must not compute a TDY cost. Domain is scored only if the model passes
# one (it's optional), and then it must be the right one.
# answer_regex encodes the fact the answer must contain, taken from the
# corpus passage labelled in retrieval_gold.yaml.

- id: reg_gtcc_mandatory
  category: regulation
  tab: regulation
  turns:
    - message: "Is the government travel charge card mandatory for my TDY trip?"
      expect:
        tools_required: [search_regulations]
        tools_forbidden: [fill_form, calculate_travel_cost]
        args:
          search_regulations:
            domain: {eq: travel, optional: true}
        form: none
        answer_regex: ["^\\W*yes", "GTCC|travel charge card"]

- id: reg_leave_accrual
  category: regulation
  tab: leave
  turns:
    - message: "How many days of leave do I accrue per month on active duty?"
      expect:
        tools_required: [search_regulations]
        tools_forbidden: [fill_form, calculate_travel_cost]
        args:
          search_regulations:
            domain: {eq: leave, optional: true}
        form: none
        answer_regex: ["2\\.5"]

