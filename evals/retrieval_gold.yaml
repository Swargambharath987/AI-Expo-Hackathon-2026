# Retrieval gold set for search_regulations.
#
# A retrieved chunk counts as RELEVANT when its metadata source_file equals
# `source` AND its text matches `text_regex` (case-insensitive) for ANY entry
# in `relevant`. Labels were written by reading the ChromaDB collection
# (vectorstore/, collection "dutyline"), not by looking at what the retriever
# returns. `verified_chunks` records the chunk ids the rules matched when the
# set was written (Nov 2026 vectorstore); the eval re-derives the relevant set
# from the rules every run and warns if it drifts (e.g. after re-ingest).
#
# Note: metadata section_title is almost always a running page header
# ("AR 600–8–10 • 3 June 2020 9"), so it cannot be used as a label. The PDFs
# use en-dashes in paragraph numbers ("2–3."), hence the [-–] classes.
#
# domain: the domain filter a well-behaved agent would pass (travel | leave |
# regs | eval). The eval scores retrieval both without a filter (what happens
# when the model omits `domain`) and with this filter.
# difficulty: direct (keywords overlap the source) | paraphrase (lay wording)

