  # generalises or only fits the queries it was tuned on. Labels: first a
  # phrase search of the corpus, then TREC-style pooling — the top 4 from the
  # old and new retrievers (with and without domain filter) were read and
  # judged, and every relevant passage added, before scoring either system.
