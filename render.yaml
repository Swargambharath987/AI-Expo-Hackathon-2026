services:
  - type: web
    name: duty-line
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Needs about 2 GB of RAM (search model + indexes); a 512 MB plan will be
    # killed on the first regulation search. Pick a plan with 2 GB or more.
    plan: starter
    envVars:
      - key: LLM_BASE_URL
        value: https://api.anthropic.com/v1
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: LLM_API_KEY
        sync: false
